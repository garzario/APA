name: CapitalCircles
options:
  bundleIdPrefix: com.capitalcircles
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: "Capital Circles"

targets:
  CapitalCircles:
    type: application
    platform: iOS
    sources:
      - path: CapitalCircles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.capitalcircles.app
        PRODUCT_NAME: "Capital Circles"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
    info:
      path: CapitalCircles/Info.plist
      properties:
        CFBundleDisplayName: "Capital Circles"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
